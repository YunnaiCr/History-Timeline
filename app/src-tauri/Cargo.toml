[package]
name = "history-timeline"
version = "0.1.0"
description = "历史事件线"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "history_timeline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
